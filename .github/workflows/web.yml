# Builds the web app and publishes it to GitHub Pages.
#
# Manual for now: GitHub Pages needs a public repository (or a paid plan) and "GitHub Actions" chosen as the
# source in the repository's Pages settings. Once that is done, add this under `on:` to publish on every change:
#   push:
#     branches: [main]
#     paths: ['web/**', 'shared/golden/**']
name: Web app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
